name: Release

on:
  push:
    tags: ['v*']

jobs:
  build-binary:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    permissions:
      packages: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae

      - name: Build release binary
        run: cargo build --release -p ntgw-app --features allocator-jemalloc

      - name: Strip and checksum
        run: |
          strip target/release/ntgw-app
          sha256sum target/release/ntgw-app > target/release/ntgw-app.sha256

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Prepare Docker build context
        run: |
          mkdir -p /tmp/docker-build/tests/testdata
          cp -r . /tmp/docker-build/dataplane

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag,suffix=-${{ matrix.arch }}
            type=semver,pattern={{version}},suffix=-${{ matrix.arch }}
            type=semver,pattern={{major}}.{{minor}},suffix=-${{ matrix.arch }}
            type=semver,pattern={{major}},suffix=-${{ matrix.arch }}

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: /tmp/docker-build
          file: /tmp/docker-build/dataplane/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DATAPLANE_CARGO_FEATURES=allocator-jemalloc
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ntgw-app-${{ matrix.arch }}
          path: |
            target/release/ntgw-app
            target/release/ntgw-app.sha256

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build-binary
    permissions:
      contents: write
      packages: write

    steps:
      - name: Download amd64 artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ntgw-app-amd64
          path: artifacts/amd64

      - name: Download arm64 artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ntgw-app-arm64
          path: artifacts/arm64

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute semver components
        id: semver
        run: |
          # github.ref_name is like "v1.2.3"
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR="${VERSION%%.*}"
          MINOR_PATCH="${VERSION#*.}"
          MINOR="${MINOR_PATCH%%.*}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "major=${MAJOR}" >> "$GITHUB_OUTPUT"
          echo "minor=${MAJOR}.${MINOR}" >> "$GITHUB_OUTPUT"

      - name: Create multi-arch manifest (exact tag)
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/${{ github.repository }}:${{ github.ref_name }}" \
            "ghcr.io/${{ github.repository }}:${{ github.ref_name }}-amd64" \
            "ghcr.io/${{ github.repository }}:${{ github.ref_name }}-arm64"

      - name: Create multi-arch manifest (major.minor)
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/${{ github.repository }}:${{ steps.semver.outputs.minor }}" \
            "ghcr.io/${{ github.repository }}:${{ steps.semver.outputs.version }}-amd64" \
            "ghcr.io/${{ github.repository }}:${{ steps.semver.outputs.version }}-arm64"

      - name: Create multi-arch manifest (major)
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/${{ github.repository }}:${{ steps.semver.outputs.major }}" \
            "ghcr.io/${{ github.repository }}:${{ steps.semver.outputs.version }}-amd64" \
            "ghcr.io/${{ github.repository }}:${{ steps.semver.outputs.version }}-arm64"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@7c4723f7a335432393329f8f1c564994ce50185d
        with:
          files: |
            artifacts/amd64/ntgw-app
            artifacts/amd64/ntgw-app.sha256
            artifacts/arm64/ntgw-app
            artifacts/arm64/ntgw-app.sha256
          generate_release_notes: true
