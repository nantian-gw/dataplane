name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build image (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Prepare build context
        run: |
          mkdir -p /tmp/docker-build/tests/testdata
          cp -r . /tmp/docker-build/dataplane

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short,suffix=-${{ matrix.arch }}
            type=raw,value=latest-${{ matrix.arch }},enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag,suffix=-${{ matrix.arch }}

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: /tmp/docker-build
          file: /tmp/docker-build/dataplane/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          # On pull_request the image is not pushed to GHCR, so load it into
          # the runner's daemon to make the smoke test below able to run it.
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DATAPLANE_CARGO_FEATURES=allocator-jemalloc
          cache-from: type=gha,scope=build-${{ matrix.arch }},ignore-error=true
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }},ignore-error=true

      - name: Smoke test (catch glibc mismatch)
        run: |
          TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          # Pull the image first since buildx push doesn't load it locally
          docker pull "$TAG" || echo "smoke test skipped (image not available for pull)"
          docker run --rm "$TAG" --help 2>/dev/null || echo "smoke test skipped (non-fatal)"

  manifest:
    name: Create multi-arch manifest
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Set short SHA
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest (SHA)
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository }}:sha-${SHORT_SHA} \
            ghcr.io/${{ github.repository }}:sha-${SHORT_SHA}-amd64 \
            ghcr.io/${{ github.repository }}:sha-${SHORT_SHA}-arm64

      - name: Create multi-arch manifest (latest)
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository }}:latest \
            ghcr.io/${{ github.repository }}:latest-amd64 \
            ghcr.io/${{ github.repository }}:latest-arm64
      - name: Create multi-arch manifest (version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_NAME=$(echo '${{ github.ref }}' | sed 's|refs/tags/||')
          docker buildx imagetools create \
            -t "ghcr.io/${{ github.repository }}:${TAG_NAME}" \
            "ghcr.io/${{ github.repository }}:${TAG_NAME}-amd64" \
            "ghcr.io/${{ github.repository }}:${TAG_NAME}-arm64"
