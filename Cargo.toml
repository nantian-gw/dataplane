[workspace]
members = [
  "crates/aeg-ai",
  "crates/aeg-allocator",
  "crates/aeg-app",
  "crates/aeg-bench",
  "crates/aeg-config",
  "crates/aeg-http",
  "crates/aeg-ir",
  "crates/aeg-observability",
  "crates/aeg-proto",
  "crates/aeg-shared-tls",
  "crates/aeg-stream",
  "crates/aeg-wasm",
  "crates/aeg-wasm-sdk",
  "crates/aeg-xds",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.98"
arc-swap = "1.7.1"
async-trait = "0.1.88"
axum = "0.8.9"
base64 = "0.22.1"
bytes = "1.10.1"
clap = { version = "4.6.1", features = ["derive"] }
dashmap = "6.1.0"
form_urlencoded = "1.2.2"
getrandom = "0.2.15"
humantime = "2.1.0"
hmac = "0.12.1"
http = "1.4.0"
nix = "0.24.3"
opentelemetry = "0.31.0"
opentelemetry-otlp = { version = "0.31.0", features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio", "trace"] }
parking_lot = "0.12.3"
pingora = { version = "0.8.0", default-features = false, features = ["proxy", "openssl", "cache"] }
pingora-cache = "0.8.0"
prost = "0.13.5"
prost-types = "0.13.5"
proptest = "1.6.0"
regex = "1.12.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
sha2 = "0.10.8"
socket2 = "0.6.3"
stats_alloc = "0.1.10"
subtle = "2.6.1"
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = "0.1.17"
tonic = { version = "0.12.3", features = ["transport", "tls"] }
tonic-build = "0.12.3"
tower = { version = "0.5.2", features = ["util"] }
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-opentelemetry = "0.32.0"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "json"] }
aeg-allocator = { version = "0.1.0", path = "crates/aeg-allocator" }
aeg-config = { version = "0.1.0", path = "crates/aeg-config" }
aeg-http = { version = "0.1.0", path = "crates/aeg-http" }
aeg-ir = { version = "0.1.0", path = "crates/aeg-ir" }
aeg-observability = { version = "0.1.0", path = "crates/aeg-observability" }
aeg-proto = { version = "0.1.0", path = "crates/aeg-proto" }
aeg-shared-tls = { version = "0.1.0", path = "crates/aeg-shared-tls" }
aeg-stream = { version = "0.1.0", path = "crates/aeg-stream" }
aeg-wasm = { version = "0.1.0", path = "crates/aeg-wasm" }
aeg-wasm-sdk = { version = "0.1.0", path = "crates/aeg-wasm-sdk" }
aeg-xds = { version = "0.1.0", path = "crates/aeg-xds" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
