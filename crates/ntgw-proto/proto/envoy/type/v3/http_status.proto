syntax = "proto3";

package envoy.type.v3;

enum StatusCode {
  Empty = 0;
  Continue = 100;
  OK = 200;
  Created = 201;
  Accepted = 202;
  NoContent = 204;
  MovedPermanently = 301;
  Found = 302;
  NotModified = 304;
  BadRequest = 400;
  Unauthorized = 401;
  Forbidden = 403;
  NotFound = 404;
  MethodNotAllowed = 405;
  Conflict = 409;
  TooManyRequests = 429;
  InternalServerError = 500;
  BadGateway = 502;
  ServiceUnavailable = 503;
  GatewayTimeout = 504;
}

message HttpStatus {
  StatusCode code = 1;
}
