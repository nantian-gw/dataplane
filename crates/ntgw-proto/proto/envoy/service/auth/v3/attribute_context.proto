syntax = "proto3";

package envoy.service.auth.v3;

message AttributeContext {
  Request request = 4;

  message Request {
    HttpRequest http = 2;
  }

  message HttpRequest {
    string id = 1;
    string method = 2;
    map<string, string> headers = 3;
    string path = 4;
    string host = 5;
    string scheme = 6;
    string query = 7;
    bytes body = 8;
    string protocol = 9;
  }
}
